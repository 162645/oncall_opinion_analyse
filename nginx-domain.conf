server { listen 80; server_name weishilin.top www.weishilin.top; location / { proxy_pass http://127.0.0.1:5173; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; } }
server { listen 80; server_name short.weishilin.top; root /var/www/url-shortener; index index.html; location /api/ { proxy_pass http://127.0.0.1:8088; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; } location ~ ^/[A-Za-z0-9]+$ { proxy_pass http://127.0.0.1:8088; proxy_set_header Host $host; } location / { add_header Cache-Control "no-store"; try_files $uri $uri/ /index.html; } }
