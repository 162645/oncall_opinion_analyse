syntax = "proto3";

package agent;

option go_package = "github.com/oec/oncall_opinion_analyse/proto_gen/go/agent";

// ============================================================
// Agent 服务定义
// Go 核心服务 <-> Python AI 层 的通信接口
// ============================================================

service AgentService {
  // 智能诊断 - 核心接口
  rpc Diagnose(DiagnoseRequest) returns (DiagnoseResponse);

  // 知识检索 - 独立查询接口
  rpc SearchKnowledge(SearchRequest) returns (SearchResponse);

  // 可视化生成 - 图表生成接口
  rpc Visualize(VisualizeRequest) returns (VisualizeResponse);

  // 流式诊断 - 支持实时反馈的长任务
  rpc DiagnoseStream(DiagnoseRequest) returns (stream DiagnoseChunk);

  // 健康检查
  rpc HealthCheck(HealthCheckRequest) returns (HealthCheckResponse);
}

// ============================================================
// 诊断相关消息
// ============================================================

message DiagnoseRequest {
  // 会话 ID，用于多轮对话
  string session_id = 1;

  // 用户查询内容
  string query = 2;

  // Agent 协作模式: sequential, parallel, hierarchical, debate
  string mode = 3;

  // 上下文信息
  map<string, string> context = 4;
}

message DiagnoseResponse {
  // 是否成功
  bool success = 1;

  // 诊断结果消息
  string message = 2;

  // 识别的意图: diagnosis, query, visualization
  string intent = 3;

  // 置信度 0-1
  float confidence = 4;

  // 执行追踪
  repeated TraceStep trace = 5;

  // 图表数据
  ChartData chart_data = 6;

  // Skill 推荐信息
  SkillRecommendation skill_recommendation = 7;
}

// 执行追踪步骤
message TraceStep {
  int32 step_id = 1;
  string step_type = 2;      // router, agent, tool, retrieval
  string agent_name = 3;
  string action = 4;
  string reasoning = 5;
  int32 duration_ms = 6;
  string status = 7;         // success, failed, pending
}

// 图表数据
message ChartData {
  string base64 = 1;         // Base64 编码的图片
  string title = 2;
  string description = 3;
  string chart_type = 4;     // line, bar, pie, etc.
}

// Skill 推荐
message SkillRecommendation {
  bool recommended = 1;
  string reason = 2;
  string suggested_name = 3;
  string suggested_description = 4;
  float confidence = 5;
}

// 流式诊断响应块
message DiagnoseChunk {
  string step_name = 1;
  string status = 2;
  string message = 3;
  bool is_final = 4;
  DiagnoseResponse final_result = 5;
}

// ============================================================
// 知识检索相关消息
// ============================================================

message SearchRequest {
  string query = 1;
  int32 top_k = 2;
  repeated string filters = 3;
  string collection = 4;     // 知识库集合名称
}

message SearchResponse {
  bool success = 1;
  repeated SearchResult results = 2;
  int32 total = 3;
  string error = 4;
}

message SearchResult {
  string doc_id = 1;
  string content = 2;
  float score = 3;
  map<string, string> metadata = 4;
  int32 chunk_index = 5;
}

// ============================================================
// 可视化相关消息
// ============================================================

message VisualizeRequest {
  string query = 1;
  string output_format = 2;  // base64, html, file
  int32 width = 3;
  int32 height = 4;
}

message VisualizeResponse {
  bool success = 1;
  string chart_base64 = 2;
  string chart_html = 3;
  string title = 4;
  string description = 5;
  string chart_type = 6;
  string error = 7;
}

// ============================================================
// 健康检查
// ============================================================

message HealthCheckRequest {
  string service = 1;
}

message HealthCheckResponse {
  enum ServingStatus {
    UNKNOWN = 0;
    SERVING = 1;
    NOT_SERVING = 2;
  }
  ServingStatus status = 1;
  string version = 2;
  map<string, string> components = 3;  // 组件状态
}
