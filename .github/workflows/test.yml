name: harness-tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install harness dependencies
        run: pip install -r requirements-harness.txt
      - name: Run contract and integration tests
        # The root suite is the maintained Harness contract. The historical
        # tests/grpc_test suite has its own generated-proto/runtime profile.
        run: >-
          pytest -q
          tests/test_evidence_harness_contract.py
          tests/test_harness_graph.py
          tests/test_mcp_catalog_adapter.py
          tests/test_network_harness_eval.py
